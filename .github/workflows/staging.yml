name: Deploy Staging Preview

on:
  push:
    branches-ignore: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: staging-preview
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    outputs:
      pages-mode: ${{ steps.pages-source.outputs.mode }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build staging variant
        env:
          VITE_GAS_ENDPOINT: "https://script.google.com/macros/s/AKfycbxjBvowI9VBP4wIn_OpGolXW-pVZxKhigby68gGuplNGdyYPcn9GEcFYZhPzGJ9ipJK/exec"
          VITE_MUSIC_GAS_ENDPOINT: "https://script.google.com/macros/s/AKfycbxy4MH-lBmB5DYHk_Gcijqf-lJHV4kt24qKUCq7eH2c99kIYlxPjhMGh8PfvZs1wT6O/exec"
          VITE_STAGING: "1"
        run: npm run build:staging

      - name: Generate article shells (staging)
        run: node scripts/generate-article-shells.mjs dist-staging "https://script.google.com/macros/s/AKfycbxjBvowI9VBP4wIn_OpGolXW-pVZxKhigby68gGuplNGdyYPcn9GEcFYZhPzGJ9ipJK/exec" https://freddiefujiwara.com/blog/staging/ --allow-empty

      - name: Detect Pages publishing source
        id: pages-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)"
          case "$mode" in legacy|workflow) ;; *) exit 1 ;; esac
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"

      - name: Install Chromium for the branch preview check
        run: npx playwright install --with-deps chromium

      - name: Verify the staging build locally
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort --base /blog/staging/ --outDir dist-staging &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/blog/staging/ -o /dev/null; then break; fi
            sleep 1
          done
          BLOG_LOCAL_STAGING=1 npx playwright test e2e/staging-local.check.js

      - name: Upload the branch preview bundle
        if: steps.pages-source.outputs.mode == 'workflow'
        uses: actions/upload-artifact@v7
        with:
          name: blog-staging-preview
          path: dist-staging
          retention-days: 7

      - name: Deploy staging preview to GitHub Pages
        if: steps.pages-source.outputs.mode == 'legacy'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-staging
          destination_dir: staging
          keep_files: true

  e2e:
    needs: deploy-staging
    if: needs.deploy-staging.outputs.pages-mode == 'legacy'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Wait for GitHub Pages to publish the preview
        run: sleep 60

      - name: Run staging checks
        env:
          APP: blog
          HOME: /root
        run: npx playwright test e2e/staging.check.js

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7
