name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Daily 06:35 JST: regenerate article OGP shells even on days without code changes.
    - cron: "35 21 * * *"
  workflow_dispatch:

concurrency:
  group: blog-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  assemble:
    # Production deploys happen on merge (push), on the daily schedule and
    # on manual dispatch — never from a pull request. Pull requests are
    # verified on staging only (see staging.yml).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    outputs:
      pages-mode: ${{ steps.pages-source.outputs.mode }}
    env:
      # Bump this repository variable after deploying a new OGP renderer design.
      BLOG_OGP_RENDERER_VERSION: ${{ vars.BLOG_OGP_RENDERER_VERSION }}

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
      - name: Detect Pages publishing source
        id: pages-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)"
          case "$mode" in legacy|workflow) ;; *) exit 1 ;; esac
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"

      - name: Generate OGP image
        run: |
          # URL-encoded title: ブログ
          JSON_RESPONSE=$(curl -L -s "https://script.google.com/macros/s/AKfycbzbMAKxkzHlwN8SY7ygJA34xYESMNNdkGNt8vv1XMcZSksgHsUwOxCCdP-wgg6fv7M/exec?t=%E3%83%96%E3%83%AD%E3%82%B0")
          echo $JSON_RESPONSE | jq -r '.png' | base64 -d > ./dist/ogp.png
          ls -lh ./dist/ogp.png

      - name: Restore production image cache
        if: steps.pages-source.outputs.mode == 'workflow'
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/blog-previous-ogp/ogp
          key: blog-prod-images-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: blog-prod-images-v1-

      - name: Restore previous article images
        run: |
          previous="$RUNNER_TEMP/blog-previous-ogp"
          mkdir -p "$previous"
          if [ ! -s "$previous/ogp/render-manifest.json" ] &&
             git fetch --no-tags --depth=1 origin refs/heads/gh-pages &&
             git cat-file -e FETCH_HEAD:ogp; then
            git archive FETCH_HEAD ogp | tar -x -C "$previous" || echo "Previous OGP cache unavailable"
          fi
          printf 'BLOG_PREVIOUS_OGP_DIR=%s/ogp\n' "$previous" >> "$GITHUB_ENV"

      - name: Generate article shells
        run: node scripts/generate-article-shells.mjs dist "https://script.google.com/macros/s/AKfycbydcnw4yt5K8lz8Wf0PCbG6Q9yD3jf1W2lsGucOor2KII7duJr7qevcMiwNHJTe8GZH/exec" https://freddiefujiwara.com/blog/

      - name: Prepare production image cache
        if: steps.pages-source.outputs.mode == 'workflow'
        run: |
          path="$RUNNER_TEMP/blog-previous-ogp/ogp"
          rm -rf -- "$path"
          cp -a dist/ogp "$path"

      - name: Save production image cache
        if: steps.pages-source.outputs.mode == 'workflow'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/blog-previous-ogp/ogp
          key: blog-prod-images-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build staging variant into dist/staging
        env:
          VITE_GAS_ENDPOINT: "https://script.google.com/macros/s/AKfycbxjBvowI9VBP4wIn_OpGolXW-pVZxKhigby68gGuplNGdyYPcn9GEcFYZhPzGJ9ipJK/exec"
          VITE_MUSIC_GAS_ENDPOINT: "https://script.google.com/macros/s/AKfycbxy4MH-lBmB5DYHk_Gcijqf-lJHV4kt24qKUCq7eH2c99kIYlxPjhMGh8PfvZs1wT6O/exec"
          VITE_STAGING: "1"
        run: |
          npm run build:staging
          mkdir -p dist/staging
          cp -r dist-staging/* dist/staging/

      - name: Generate article shells (staging)
        run: node scripts/generate-article-shells.mjs dist/staging "https://script.google.com/macros/s/AKfycbxjBvowI9VBP4wIn_OpGolXW-pVZxKhigby68gGuplNGdyYPcn9GEcFYZhPzGJ9ipJK/exec" https://freddiefujiwara.com/blog/staging/ --allow-empty
      - name: Upload the Pages artifact
        id: pages-artifact
        continue-on-error: steps.pages-source.outputs.mode == 'legacy'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to the legacy Pages branch
        if: steps.pages-source.outputs.mode == 'legacy'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  publish:
    needs: assemble
    if: needs.assemble.outputs.pages-mode == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
